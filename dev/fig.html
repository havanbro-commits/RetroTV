<!doctype html><html><body style="margin:0;background:#222">
<canvas id="c" width="300" height="492"></canvas><img id="sp" src="../assets/eggs/figurine-day.png" style="width:300px;height:492px;image-rendering:auto">
<canvas id="o" width="300" height="492"></canvas>
<script src="figurine.js"></script>
<script>
const W=75,H=123, K=4;
const c=document.getElementById('c'); const gl=c.getContext('webgl',{premultipliedAlpha:false,preserveDrawingBuffer:true});
const VS='attribute vec2 a; varying vec2 v; void main(){ v = a*0.5+0.5; v.y = 1.0 - v.y; gl_Position=vec4(a,0.,1.); }';
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;}
const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,FIG_SHADER));gl.bindAttribLocation(p,0,'a');gl.linkProgram(p);gl.useProgram(p);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(p,n);
window.render=(theta, photoW, key)=>{
  // модель: 1 ед = 95 px фото; низ — y=112 px, центр x=37.5 px
  gl.uniform4f(U('uBox'), 95/W, 95/H, 37.5/W, (H-112)/H);
  gl.uniform4f(U('uPh'), 95, 37.5, 112, 0); gl.uniform2f(U('uPhSize'), W, H);
  gl.uniform1f(U('uTheta'), theta); gl.uniform1f(U('uPhotoW'), photoW);
  gl.uniform3fv(U('uKey'), key||[0.6,0.5,0.6]); gl.uniform3f(U('uAmbT'),0.62,0.55,0.48); gl.uniform3f(U('uAmbB'),0.35,0.26,0.18); gl.uniform3f(U('uKeyC'),0.75,0.62,0.45);
  gl.viewport(0,0,c.width,c.height); gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
};
const img=document.getElementById('sp');
const init=()=>{const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
 gl.uniform1i(U('uPhoto'),0); window.ready=true;};
if(img.complete&&img.naturalWidth) init(); else img.onload=init;
window.iou=()=>{ // сравнение силуэтов
  const px=new Uint8Array(c.width*c.height*4); gl.readPixels(0,0,c.width,c.height,gl.RGBA,gl.UNSIGNED_BYTE,px);
  const o=document.getElementById('o').getContext('2d'); o.drawImage(img,0,0,300,492); const sp=o.getImageData(0,0,300,492).data;
  let I=0,Un=0; const out=o.createImageData(300,492);
  for(let y=0;y<492;y++)for(let x=0;x<300;x++){const a=px[((491-y)*300+x)*4+3]>128, b2=sp[(y*300+x)*4+3]>128; if(a&&b2)I++; if(a||b2)Un++;
    const k=(y*300+x)*4; out.data[k]=a?255:0; out.data[k+1]=b2?255:0; out.data[k+2]=0; out.data[k+3]=255;}
  o.putImageData(out,0,0); return I/Un; };
</script></body></html>
