<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Приставка — Tube TV</title>
<!-- Приставка для Tube TV: эмулятор Mega Drive (EmulatorJS + Genesis Plus GX).
     Картридж — параметр ?rom=… (адрес файла или blob:), ?name=… — имя файла (нужно для blob:).
     Внутри комнаты страница живёт в невидимой рамке за кинескопом: кадр забирает шейдер телевизора,
     звук идёт в «динамик» телевизора (общий AudioContext комнаты), кнопки и геймпад читает комната.
     Открытая сама по себе — обычный эмулятор с клавиатурой и геймпадом. -->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #game { position: absolute; inset: 0; }
  /* никаких кнопок эмулятора поверх картинки: только игра */
  .ejs_menu_bar, .ejs_menu_bar_hidden, .ejs_context_menu, .ejs_start_button, .ejs_settings_parent,
  .ejs_ad_iframe, .ejs_message, .ejs_netplay_header { display: none !important; }
  .embedded .ejs_popup_container, .embedded .ejs_virtualGamepad_parent { display: none !important; }
  .ejs_parent, .ejs_canvas_parent { background: #000 !important; }
  .ejs_canvas { cursor: none; }
  #boot { position: absolute; inset: 0; display: grid; place-items: center; color: #9fb0d0;
    font: 14px/1.4 ui-monospace, Menlo, monospace; letter-spacing: 1px; background: #000; z-index: 5; transition: opacity .4s; }
  #boot.off { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="game"></div>
<div id="boot">ЗАГРУЗКА…</div>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const rom = q.get('rom');
  const boot = document.getElementById('boot');
  const host = (() => { try { return parent !== window && parent.TubeTVHost ? parent.TubeTVHost : null; } catch (_) { return null; } })();
  const say = m => { try { if (parent !== window) parent.postMessage(Object.assign({ from: 'sega' }, m), location.origin); } catch (_) {} };
  if (host) document.documentElement.classList.add('embedded');
  if (!rom) { boot.textContent = 'НЕТ КАРТРИДЖА'; say({ type: 'error', msg: 'no rom' }); return; }

  /* 1. Ровно 60 кадров в секунду. Эмулятор считает по кадру на каждый requestAnimationFrame,
        а экраны бывают на 120 и 144 Гц (MacBook Pro, iPad Pro, игровые мониторы) — без ограничителя
        игра шла бы вдвое быстрее. И наоборот: если страница рисует реже 60 раз (слабая машина,
        тяжёлая сцена), кадр игры досчитывается по таймеру — скорость игры и звук не плывут. */
  const raf0 = window.requestAnimationFrame.bind(window), P = 1000 / 60, due = new WeakMap();
  window.requestAnimationFrame = cb => {
    let done = false;
    const run = t => {
      if (done) return true;
      const now = performance.now(), d = due.get(cb);
      if (d && now < d - 3) return false;
      done = true; due.set(cb, Math.max((d || now) + P, now + P / 2));
      cb(t == null ? now : t);
      return true;
    };
    const tick = t => { if (!run(t)) raf0(tick); };
    raf0(tick);
    const d = due.get(cb), wait = d ? Math.max(0, d - performance.now()) + 6 : 40;
    setTimeout(function guard() { if (!done && !run()) setTimeout(guard, 2); }, wait);
    return 0;
  };

  /* 2. Кадр должен оставаться в буфере, чтобы телевизор мог забрать его в любой момент */
  const getContext0 = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function (type, attrs) {
    if (/webgl/i.test(type)) attrs = Object.assign({}, attrs || {}, { preserveDrawingBuffer: true });
    return getContext0.call(this, type, attrs);
  };

  /* 3. Звук — в общий AudioContext комнаты: в «динамик» телевизора, с его тембром и громкостью.
        Отдельный контекст в рамке Safari не запустил бы без клика по самой рамке. */
  let shared = false;
  if (host && host.audio) {
    try {
      const a = host.audio();
      if (a && a.ctx && a.dest) {
        const real = a.ctx, dest = a.dest;
        const prm = () => ({ value: 0, setValueAtTime() {}, setTargetAtTime() {}, linearRampToValueAtTime() {} });
        // у комнаты свой слушатель (объёмный звук для наушников) — эмулятор его не трогает
        const listener = { positionX: prm(), positionY: prm(), positionZ: prm(), forwardX: prm(), forwardY: prm(), forwardZ: prm(),
          upX: prm(), upY: prm(), upZ: prm(), setPosition() {}, setOrientation() {} };
        const proxy = new Proxy(real, {
          get(t, k) {
            if (k === 'destination') return dest;
            if (k === 'listener') return listener;
            if (k === 'close' || k === 'suspend') return () => Promise.resolve();
            const v = Reflect.get(t, k, t);
            return typeof v === 'function' ? v.bind(t) : v;
          },
          set(t, k, v) { if (k !== 'onstatechange') t[k] = v; return true; },
        });
        const Shared = function () { return proxy; };
        window.AudioContext = Shared; window.webkitAudioContext = Shared;
        shared = true;
      }
    } catch (_) {}
  }
  /* экран не гаснет во время игры; если браузер не разрешил — молча играем дальше */
  try {
    const wl = navigator.wakeLock;
    if (wl && wl.request) { const req = wl.request.bind(wl); wl.request = t => req(t).catch(() => ({ release() {} })); }
  } catch (_) {}
  /* 4. Геймпад и клавиатуру внутри комнаты читает сама комната (рамка фокуса не получает) */
  if (host) { try { navigator.getGamepads = () => []; } catch (_) {} }

  window.EJS_player = '#game';
  window.EJS_core = 'segaMD';
  window.EJS_gameUrl = rom;
  window.EJS_gameName = q.get('name') || undefined;
  window.EJS_pathtodata = 'vendor/ejs/data/';
  window.EJS_DEBUG_XX = true;              // без минифицированной сборки: грузим исходники рядом
  window.EJS_startOnLoaded = true;
  window.EJS_language = 'ru-RU';
  window.EJS_color = '#111111';
  window.EJS_backgroundColor = '#000';
  window.EJS_threads = false;
  window.EJS_disableDatabases = true;
  window.EJS_noAutoFocus = !!host;
  window.EJS_volume = shared ? 1 : Math.max(0, Math.min(1, parseFloat(q.get('vol') || '0.7')));
  window.EJS_Buttons = { playPause: false, restart: false, mute: false, settings: false, fullscreen: false, saveState: false, loadState: false,
    screenRecord: false, gamepad: false, cheat: false, volume: false, saveSavFiles: false, loadSavFiles: false, quickSave: false, quickLoad: false,
    screenshot: false, cacheManager: false, exitEmulation: false, netplay: false, diskButton: false, contextMenu: false };
  window.EJS_defaultOptions = { 'save-state-location': 'browser', 'genesis_plus_gx_audio_filter': 'low-pass' };
  // сама по себе: стрелки, A / S / D — кнопки A / B / C, Q / W / E — X / Y / Z, Enter — Start
  window.EJS_defaultControls = {
    0: {
      0: { value: 's', value2: 'BUTTON_2' }, 1: { value: 'a', value2: 'BUTTON_4' }, 2: { value: 'v', value2: 'SELECT' }, 3: { value: 'enter', value2: 'START' },
      4: { value: 'up arrow', value2: 'DPAD_UP' }, 5: { value: 'down arrow', value2: 'DPAD_DOWN' }, 6: { value: 'left arrow', value2: 'DPAD_LEFT' }, 7: { value: 'right arrow', value2: 'DPAD_RIGHT' },
      8: { value: 'd', value2: 'BUTTON_1' }, 9: { value: 'w', value2: 'BUTTON_3' }, 10: { value: 'q', value2: 'LEFT_TOP_SHOULDER' }, 11: { value: 'e', value2: 'RIGHT_TOP_SHOULDER' },
    }, 1: {}, 2: {}, 3: {},
  };
  const em = () => window.EJS_emulator;
  /* для комнаты: кадр, кнопки, пауза */
  window.TubeSega = {
    shared,
    canvas() { const e = em(); return e && e.started ? e.canvas : null; },
    input(player, idx, v) { const e = em(); if (e && e.started && e.gameManager) e.gameManager.simulateInput(player, idx, v); },
    pause() { const e = em(); if (!e || !e.started) return; if (!e.paused) { if (e.pause) e.pause(true); else e.gameManager.toggleMainLoop(0); } },
    play() { const e = em(); if (!e || !e.started) return; if (e.paused) { if (e.play) e.play(true); else e.gameManager.toggleMainLoop(1); } },
    reset() { const e = em(); if (e && e.started && e.gameManager) e.gameManager.restart(); },
    volume(v) { const e = em(); if (e && e.setVolume) e.setVolume(Math.max(0, Math.min(1, v))); },
  };
  window.EJS_ready = () => say({ type: 'ready' });
  window.EJS_onGameStart = () => {
    boot.classList.add('off'); say({ type: 'start', shared });
    if (!host) { try { em().elements.parent.focus(); } catch (_) {} }
  };
  addEventListener('ejs-error', ev => { boot.textContent = 'КАРТРИДЖ НЕ ЗАПУСТИЛСЯ'; boot.classList.remove('off'); say({ type: 'error', msg: ev.detail }); });
  addEventListener('error', ev => say({ type: 'warn', msg: String(ev.message || ev) }));
  if (!host) addEventListener('pointerdown', () => { try { (em().elements.parent || document.body).focus(); } catch (_) {} });

  const s = document.createElement('script'); s.src = 'vendor/ejs/data/loader.js';
  s.onerror = () => { boot.textContent = 'ЭМУЛЯТОР НЕ ЗАГРУЗИЛСЯ'; say({ type: 'error', msg: 'loader' }); };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
